<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原版识词实测</title><style>body{font:16px/1.7 Arial,sans-serif;max-width:1150px;margin:24px auto;padding:0 16px}button{font:inherit;padding:12px}pre{white-space:pre-wrap;padding:16px;background:#eef4ef}iframe{width:100%;height:700px;border:1px solid #ccc}canvas{max-width:240px;border:1px solid #ddd;margin:8px}</style></head><body><h1>原版识词质量检查</h1><p>以真实PNG上传及真实Tesseract模型运行4轮，不使用模拟OCR。合成样本不等于用户原始截图的验收结果。测试词表不提交答案，不改学习成绩。</p><button id="run">运行4轮实测</button><pre id="report" role="status">尚未开始</pre><div id="images"></div><iframe id="app" title="待验收原版应用"></iframe><script>
const cases=[
{name:'清晰词表与界面杂字',words:['abandon','benefit','reliable','underestimate','questionnaire','departure','mechanism','quality'],noise:['ine','set','us','fei']},
{name:'真实短词不能误删',words:['set','us','fee','index','rural','queue','tender','spare'],noise:['ine','fei']},
{name:'深色模式清晰词表',words:['heal','deny','affect','tenant','postpone','nerve','media','gesture'],noise:['ine','fei'],dark:true},
{name:'空白图不覆盖已有校对内容',words:[],noise:[]}
];
const report=document.getElementById('report');let results=[];
function show(){report.textContent=JSON.stringify({results},null,2)}
async function picture(sample,index){const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=1000;const c=canvas.getContext('2d');c.fillStyle=sample.dark?'#17211c':'#ffffff';c.fillRect(0,0,1200,1000);c.fillStyle=sample.dark?'#ffffff':'#171717';c.font='34px Arial';sample.words.forEach((w,i)=>c.fillText(w,130,220+i*70));c.font='13px Arial';sample.noise.forEach((w,i)=>c.fillText(w,970,70+i*130));document.getElementById('images').append(canvas);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));return new File([blob],'ocr-round-'+index+'.png',{type:'image/png'})}
async function boot(source){const frame=document.getElementById('app');await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=source});return frame.contentWindow}
document.getElementById('run').onclick=async()=>{const button=document.getElementById('run');button.disabled=true;results=[];document.getElementById('images').replaceChildren();report.textContent='正在载入待验收版本…';try{const response=await fetch('./wordlab-ocr-candidate.html?v=strict-1');if(!response.ok)throw Error('无法载入候选版本');const source=await response.text();for(let i=0;i<cases.length;i++){const sample=cases[i],app=await boot(source),file=await picture(sample,i+1);const dt=new DataTransfer();dt.items.add(file);const input=app.document.getElementById('shot-files');input.files=dt.files;input.dispatchEvent(new app.Event('change',{bubbles:true}));if(!sample.words.length)app.document.getElementById('shot-text').value='preserved';results.push({round:i+1,name:sample.name,status:'识别中'});show();await app.readShots();const text=app.document.getElementById('shot-text').value,actual=text.trim().split(/\r?\n/).filter(Boolean),expected=sample.words.length?sample.words:['preserved'];const extras=actual.filter(w=>!expected.includes(w)),missing=expected.filter(w=>!actual.includes(w));const before=text;app.document.querySelector('#shot-previews img').click();const dialog=app.document.getElementById('shot-lightbox'),opened=dialog?.open;app.document.getElementById('shot-zoom-in').click();const scaled=app.document.getElementById('shot-lightbox-image').style.width;app.document.getElementById('shot-lightbox-image').click();const closed=!dialog.open,retained=app.document.getElementById('shot-text').value===before;results[i]={round:i+1,name:sample.name,status:!extras.length&&!missing.length&&opened&&closed&&retained?'PASS':'FAIL',actual,extras,missing,opened,closed,retained,scaled,recognitionStatus:app.document.getElementById('shot-status').textContent};show()}}catch(error){results.push({status:'ERROR',message:error.message});show()}finally{button.disabled=false;document.body.dataset.finished='true'}};
</script></body></html>
